# Hyprglass plugin — Liquid Glass effect
# Load plugin BEFORE config block (baris 1 wajib)
plugin = /var/cache/hyprpm/adibayu/HyprGlass/hyprglass.so

plugin:hyprglass {
    default_theme = dark
    default_preset = macglass
    manage_window_blur = 1

    preset = name:macglass, glass_opacity:0.78, blur_strength:1.3, blur_iterations:3
    preset = name:macglass:dark, refraction_strength:0.45, chromatic_aberration:0.28, fresnel_strength:0.45, specular_strength:0.6, edge_thickness:0.06, brightness:0.86, tint_color:0x22334415
    preset = name:waybar_glass, glass_opacity:0.88, blur_strength:0.5, blur_iterations:2
    preset = name:waybar_glass:dark, refraction_strength:0.15, chromatic_aberration:0.1, fresnel_strength:0.15, specular_strength:0.25, brightness:0.98, tint_color:0x22334408

    layers {
        enabled = 1
        namespaces = waybar
        preset = subtle
        namespace_presets = waybar:waybar_glass
        namespace_mask_thresholds = waybar=0.005
    }
}