# macOS aesthetic overrides — sourced LAST so it wins over the Omarchy theme
general {
    border_size = 2
    col.active_border = rgba(ffffff44) rgba(8a94a6aa) 90deg
    col.inactive_border = rgb(1c1e22)
    gaps_in = 6
    gaps_out = 12
}

decoration {
    rounding = 14
    shadow {
        enabled = true
        range = 36
        render_power = 2
        offset = 0 4
        color = rgba(00000045)
    }
    active_opacity = 0.93
    inactive_opacity = 0.82
}

animations {
    enabled = yes
    bezier = spring, 0.34, 1.56, 0.64, 1
    bezier = springSoft, 0.33, 1.0, 0.68, 1
    animation = windowsIn, 1, 7, spring, popin 90%
    animation = windows, 1, 6, springSoft, slide
    animation = windowsOut, 1, 5, springSoft, slide
    animation = windowsMove, 1, 6, springSoft, slide
    animation = border, 1, 4, springSoft
    animation = borderangle, 1, 4, springSoft
    animation = workspaces, 1, 6, springSoft, slide
    animation = fade, 1, 3, springSoft
    animation = fadeIn, 1, 3, springSoft
    animation = fadeOut, 1, 3, springSoft
}