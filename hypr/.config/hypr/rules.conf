# windowrule = opacity 1 1, class:.*
# windowrule = opacity 0.85 0.85, class:.*
# windowrule = suppressevent maximize, class:.*

# always open floating with custom size
# windowrulev2 = float, class:^(Alacritty)$
# windowrulev2 = size 1100 700, class:^(Alacritty)$
# Glass effect for common apps
windowrulev = opacity 0.92 0.92, class:^(kitty|Alacritty|foot)$
windowrulev = opacity 0.95 0.95, class:^(thunar|org.gnome.Nautilus)$
windowrulev = opacity 0.97 0.97, class:^(chromium|firefox)$
windowrulev = size 1100 700, class:^(chrome-web.whatsapp.com__-Default|blueberry.py)$
windowrulev = float, class:^(kitty-float)$
windowrulev = size 1100 700, class:^(kitty-float)$
windowrulev = center, class:^(kitty-float)$
windowrulev = float, class:^(chrome-web.whatsapp.com__-Default|chrome-music.youtube.com__-Default)$
windowrulev = size 1100 700, class:^(chrome-music.youtube.com__-Default)$
windowrulev = float,class:^(chrome-instagram\.com__-Default|blueberry.py)$
windowrulev = size 400 800,class:^(chrome-instagram\.com__-Default)$
windowrulev = center,class:^(chrome-instagram\.com__-Default)$

# Dialog & utility windows
windowrulev = float, title:^(Open File|Save File|Preferences|Settings)$
windowrulev = center, title:^(Open File|Save File|Preferences|Settings)$
windowrulev = size 600 500, title:^(Open File|Save File|Preferences|Settings)$
windowrulev = opacity 0.96 0.96, title:^(Open File|Save File|Preferences|Settings)$





# Fix some dragging issues with XWayland
# windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# no transparancy
# windowrule = opacity 1 1, class:antigravity|Alacritty|chromium


# macOS look: uniform rounded corners for all apps (norounding removed)

# Float + center main Mega windows
windowrulev = float, class:^(MEGAsync|MEGA)$
windowrulev = center, class:^(MEGAsync|MEGA)$
windowrulev = suppressevent maximize, class:^(MEGAsync|MEGA)$
windowrulev = float, title:^(MEGA.*|Login|Dialog)$

# Scroll faster in the terminal
# windowrule = scrolltouchpad 2.5, class:Alacritty
# windowrule = scrolltouchpad 3.5, class:kitty


# Smart gaps and borders (no borders when only 1 window open)
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]


# Disable borders for tiled windows
# windowrulev2 = noborder, floating:0

# (Optional) Enable borders for floating windows explicitly
# windowrulev2 = bordercolor rgb(88C0D0), floating:1

# special workspace for apps
windowrulev = workspace special:instagram, class:chrome-instagram.com__-Default

# lunch silently
windowrulev = workspace special:whatsapp silent, class:^(chrome-web.whatsapp.com__-Default)$
# windowrulev = workspace special:browser silent, class:^(chromium)$
windowrulev = workspace special:file silent, class:^(org.gnome.Nautilus)$
windowrulev = workspace special:waydroid silent,class:Waydroid
# Float Waydroid but fill screen
# windowrulev2 = float, class:^(waydroid)$
# windowrulev2 = nofocus, class:^(waydroid)$
# windowrulev2 = size 100% 100%, class:^(waydroid)$
# windowrulev2 = center, class:^(waydroid)$
# windowrulev2 = nofullscreenrequest, class:^(waydroid)$
#
windowrulev = rounding 12, floating:1


