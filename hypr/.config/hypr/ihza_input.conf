# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    numlock_by_default = true
    repeat_delay = 200
    repeat_rate = 20
    kb_options = altwin:swap_alt_win
    follow_mouse = 1
    sensitivity = 0.5
    # accel_profile = flat
    # scroll_factor = 0.8


    touchpad {
        natural_scroll = yes
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 1

    }
}

# gestures {
#     # workspace_swipe = true
# }

gesture = 4, swipe, move,
gesture = 3, horizontal, workspace
# gesture = 3, up, dispatcher, fullscreen, 1

# gesture = 2, pinch, float
gesture = 3, down, dispatcher, togglespecialworkspace, down
gesture = 3, up, dispatcher, togglespecialworkspace, up
# gesture = 3, up, togglespecialworkspace
# gesture = 4, up, dispatcher, global, quickshell:overviewToggle
# gesture = 4, down, dispatcher, global, quickshell:overviewClose
gestures {
    workspace_swipe_distance = 500
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_create_new = true
}

